services:

  nginx:
    image: nginx:latest
    ports:
      - "8082:80"

  ubuntu:
    build:
      context: .
      dockerfile: Dockerfile
    command: tail -f /dev/null

  mysql:
    image: mysql:8.0
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  project-data:
  mysql-data: